<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Yuguda Muhammed Shamsudeen</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#08090A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#08090A; --text:#F2F4EF; --text-muted:#8B8B92; --text-dim:#8B8B92;
            --accent:#BEF264; --accent-2:#8CB93C;
            --glass-bg:rgba(255,255,255,.035); --glass-border:rgba(255,255,255,.09);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
            line-height:1.65; min-height:100vh;
            display:flex; align-items:center; justify-content:center;
            padding:24px; text-align:center;
        }
        .glow {
            position:fixed; top:-20vh; left:50%; transform:translateX(-50%);
            width:70vw; height:60vh; border-radius:50%;
            background:radial-gradient(circle,var(--accent) 0%,transparent 70%);
            filter:blur(90px); opacity:.4; z-index:-1; pointer-events:none;
        }
        .box {
            max-width:480px; padding:44px 32px;
            border:1px solid var(--glass-border); border-radius:16px;
            background:var(--glass-bg);
            -webkit-backdrop-filter:blur(14px) saturate(140%);
            backdrop-filter:blur(14px) saturate(140%);
        }
        .code {
            font-family:'JetBrains Mono',monospace; font-size:.78rem;
            letter-spacing:.14em; color:var(--accent-2); margin-bottom:14px;
        }
        h1 {
            font-family:'Space Grotesk',sans-serif; font-size:1.7rem;
            letter-spacing:-.02em; margin-bottom:10px;
        }
        p { color:var(--text-muted); margin-bottom:26px; }
        .links { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
        a.btn {
            display:inline-block; padding:11px 24px; border-radius:999px;
            background:var(--accent);
            color:#0A0B0C; text-decoration:none; font-weight:600; font-size:.95rem;
        }
        a.alt {
            display:inline-block; padding:11px 24px; border-radius:999px;
            border:1px solid var(--glass-border); background:var(--glass-bg);
            color:var(--text); text-decoration:none; font-weight:500; font-size:.95rem;
        }
        a.alt:hover { border-color:var(--accent); color:var(--accent-2); }
        .mono {
            display:block; margin-top:22px;
            font-family:'JetBrains Mono',monospace; font-size:.8rem;
            color:var(--text-dim); text-decoration:none;
        }
        .mono:hover { color:var(--accent-2); }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <div class="box">
        <p class="code">ERROR 404</p>
        <h1>That page doesn't exist</h1>
        <p>Either the link is wrong or I moved something. The work is all on the home page.</p>
        <div class="links">
            <a class="btn" href="/">Back to the site</a>
            <a class="alt" href="/#contact">Get in touch</a>
        </div>
        <a class="mono" href="mailto:elemenx93@gmail.com">elemenx93@gmail.com</a>
    </div>
</body>
</html>
