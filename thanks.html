<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message sent — Yuguda Muhammed Shamsudeen</title>
    <!-- a confirmation page has no business in search results -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#08090A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090A;
            --text: #F2F4EF;
            --text-muted: #8B8B92;
            --accent: #BEF264;
            --accent-2: #8CB93C;
            --glass-bg: rgba(255,255,255,.035);
            --glass-border: rgba(255,255,255,.09);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            line-height: 1.65; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .glow {
            position: fixed; top: -20vh; left: 50%; transform: translateX(-50%);
            width: 70vw; height: 60vh; border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            filter: blur(90px); opacity: .4; z-index: -1; pointer-events: none;
        }
        .box {
            max-width: 460px; padding: 44px 32px;
            border: 1px solid var(--glass-border); border-radius: 16px;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
        }
        .check {
            width: 52px; height: 52px; margin: 0 auto 20px;
            border-radius: 50%; display: grid; place-items: center;
            border: 1px solid rgba(52,211,153,.4); background: rgba(52,211,153,.1);
        }
        .check svg { width: 26px; height: 26px; stroke: #34D399; }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.7rem; letter-spacing: -.02em; margin-bottom: 10px;
        }
        p { color: var(--text-muted); margin-bottom: 26px; }
        a.back {
            display: inline-block; padding: 11px 24px; border-radius: 999px;
            background: var(--accent);
            color: #0A0B0C; text-decoration: none; font-weight: 600; font-size: .95rem;
        }
        .mono {
            display: block; margin-top: 20px;
            font-family: 'JetBrains Mono', monospace; font-size: .8rem;
            color: var(--text-muted); text-decoration: none;
        }
        .mono:hover { color: var(--accent-2); }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <div class="box">
        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        </div>
        <h1>Message sent</h1>
        <p>That reached me. I'll reply the same day — usually sooner.</p>
        <a class="back" href="/">Back to the site</a>
        <a class="mono" href="mailto:elemenx93@gmail.com">elemenx93@gmail.com</a>
    </div>
</body>
</html>
